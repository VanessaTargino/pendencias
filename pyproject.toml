[project]
name = "pendencias"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.136.1,<0.137.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 79
extend-exclude = [
    'migrations',
    'htmlcov',
    '.pytest_cache',
    '__pycache__'
]

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = ['.']
addopts = ['-p', 'no:warnings']

[tool.taskipy.tasks]
pre_lint = 'typos --exclude htmlcov'
lint = 'ruff check . --exclude htmlcov'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev pendencias/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=pendencias -vv'
post_test = 'coverage html'